<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIENASTIE — Don't Wait, Just Go!</title>
<meta name="description" content="DIENASTIE — Culture / Lifestyle / Community">
<meta name="theme-color" content="#0E0B0A">

<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">

<link rel="preconnect" href="https://res.cloudinary.com">
<link rel="preconnect" href="https://i.postimg.cc">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<link
  rel="stylesheet"
  href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=satoshi@400,500,700&display=swap"
>

<style>
  :root {
    --ink: #0E0B0A;
    --bone: #E9E8E5;
    --concrete: #C8C6C2;
    --char: #35322F;
    --kraft: #A98A68;
    --clay: #C26E29;
    --clay-deep: #A25D2F;
    --font-display: "Clash Display", Helvetica, Arial, sans-serif;
    --font-body: "Satoshi", Helvetica, Arial, sans-serif;
    --ease: cubic-bezier(.16,.84,.24,1);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }

  body {
    background: var(--ink);
    color: var(--bone);
    font-family: var(--font-body);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .landing {
    position: relative;
    isolation: isolate;
    display: flex;
    min-height: 100svh;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: clamp(24px, 5vw, 72px);
  }

  .hero-image {
    position: absolute;
    z-index: -4;
    inset: 0;
    background-color: var(--ink);
    background-image: url("https://i.postimg.cc/R0Pf51DZ/B56A8755.webp");
    background-position: center;
    background-size: cover;
    filter: grayscale(1) contrast(1.14);
    transform: scale(1.025);
  }

  .hero-overlay {
    position: absolute;
    z-index: -3;
    inset: 0;
    background: rgba(14, 11, 10, .64);
  }

  .background-logo {
    position: absolute;
    z-index: -2;
    top: 50%;
    left: 50%;
    width: min(92vw, 1180px);
    height: auto;
    transform: translate(-50%, -50%);
    mix-blend-mode: multiply;
    opacity: .40;
    pointer-events: none;
    user-select: none;
  }

  .noise {
    position: absolute;
    z-index: -1;
    inset: 0;
    pointer-events: none;
    opacity: .095;
    mix-blend-mode: screen;
    background-image:
      repeating-linear-gradient(0deg, rgba(233,232,229,.08) 0 1px, transparent 1px 2px),
      repeating-linear-gradient(90deg, rgba(233,232,229,.05) 0 1px, transparent 1px 3px);
    animation: noise-shift 1.2s steps(6) infinite;
  }

  @keyframes noise-shift {
    0% { background-position: 0 0, 0 0; }
    100% { background-position: 53px 29px, -31px 17px; }
  }

  .content {
    position: relative;
    z-index: 1;
    width: min(1100px, 100%);
    padding: 0 clamp(8px, 2vw, 16px);
    text-align: center;
  }

  .headline {
    display: inline-block;
    max-width: 100%;
    margin: 0;
    color: var(--bone);
    font-family: var(--font-display);
    font-size: clamp(2.25rem, 7.8vw, 8.2rem);
    font-weight: 600;
    line-height: .9;
    letter-spacing: -.03em;
    text-align: center;
    text-transform: uppercase;
  }

  .headline-line {
    display: block;
    max-width: 100%;
    white-space: nowrap;
  }

  .headline-line--emphasis {
    font-style: italic;
    font-weight: 600;
    color: var(--clay);
    letter-spacing: -.02em;
  }

  .eyebrow {
    margin: clamp(22px, 3.5vw, 34px) 0 0;
    color: var(--clay);
    font-family: var(--font-body);
    font-size: clamp(.72rem, 1vw, .9rem);
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
  }

  .notify {
    display: flex;
    width: min(430px, 100%);
    margin: clamp(30px, 4vw, 42px) auto 0;
    gap: 12px;
    align-items: center;
    border-bottom: 1px solid var(--concrete);
    padding: 0 0 12px;
  }

  .notify input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--bone);
    font-family: var(--font-body);
    font-size: clamp(.9rem, 1.2vw, 1.05rem);
    padding: 8px 0;
  }

  .notify input::placeholder { color: var(--concrete); opacity: .9; }

  .notify button {
    flex: 0 0 auto;
    appearance: none;
    border: 0;
    border-bottom: 1px solid var(--clay);
    padding: 0 0 3px;
    background: transparent;
    color: var(--bone);
    cursor: pointer;
    font-family: var(--font-body);
    font-size: clamp(.72rem, .9vw, .85rem);
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    transition: color .2s var(--ease), border-color .2s var(--ease);
  }

  .notify button:hover,
  .notify button:focus-visible {
    color: var(--clay);
    border-color: var(--bone);
  }

  .form-status {
    min-height: 1.15em;
    margin: 12px 0 0;
    color: var(--concrete);
    font-family: var(--font-body);
    font-size: .72rem;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  .corner-mark {
    position: absolute;
    z-index: 2;
    top: clamp(20px, 3vw, 42px);
    left: clamp(20px, 3vw, 42px);
    margin: 0;
    color: var(--bone);
    font-family: var(--font-body);
    font-size: clamp(.65rem, .8vw, .78rem);
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
  }

  .established {
    position: absolute;
    z-index: 2;
    top: clamp(20px, 3vw, 42px);
    right: clamp(20px, 3vw, 42px);
    margin: 0;
    color: var(--bone);
    font-family: var(--font-body);
    font-size: clamp(.65rem, .8vw, .78rem);
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
  }

  /*
    Logo marquee — single continuous row, lifted off the browser edge.
    Bar background is --ink at 70% alpha (not CSS opacity) so the hero
    image behind shows through, while logos/borders inside stay fully
    solid. Every logo shares identical padding/sizing rules so removing
    or adding an item keeps spacing even automatically.
  */
  .marquee {
    position: fixed;
    z-index: 2;
    bottom: 20px;
    left: 0;
    width: 100%;
    overflow: hidden;
    border-top: 1px solid rgba(200,198,194,.32);
    border-bottom: 1px solid rgba(200,198,194,.32);
    background: rgba(14, 11, 10, .70);
    padding: 10px 0;
    white-space: nowrap;
  }

  .marquee-track {
    display: flex;
    width: max-content;
    align-items: center;
    will-change: transform;
    animation: marquee 30s linear infinite;
  }

  .marquee-group {
    display: flex;
    flex: 0 0 auto;
    align-items: center;
  }

  .logo-item {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 clamp(18px, 3vw, 36px);
    height: 40px;
  }

  .logo-item img {
    max-height: 68%;
    max-width: clamp(60px, 6.5vw, 96px);
    width: auto;
    height: auto;
    object-fit: contain;
    filter: grayscale(1) brightness(0) invert(1);
    opacity: 1;
  }

  .logo-item--sas img {
    max-height: 54.4%;
    max-width: clamp(48px, 5.2vw, 76.8px);
  }

  @keyframes marquee {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  /*
    Social icons — separate from the partner marquee. Small and quiet,
    sitting 20px above the marquee bar's top edge.
  */
  .social-icons {
    position: fixed;
    z-index: 3;
    right: clamp(16px, 3vw, 32px);
    bottom: calc(20px + 10px + 40px + 10px + 20px);
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .social-icons a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    color: var(--bone);
    opacity: .38;
    transition: opacity .25s var(--ease), color .25s var(--ease);
  }

  .social-icons a:hover,
  .social-icons a:focus-visible {
    opacity: .85;
    color: var(--clay);
  }

  .social-icons svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
  }

  /*
    Mobile fix: the headline used a fluid vw-based font-size with nowrap
    lines. On narrow phones the longest line ("for permission.") could
    render wider than the viewport even with vw scaling, because vw math
    doesn't account for exact character width, and uppercase transform +
    tight letter-spacing add extra rendered width on top. overflow:hidden
    on body/.landing meant the excess was silently clipped at the frame
    edge instead of wrapping or shrinking further.

    Fix: cap the mobile font-size lower (so the longest line reliably
    fits within the viewport minus padding), allow wrapping as a safety
    net if a line is still too long for any reason, and keep real
    horizontal padding via .content so text never touches the edge.
  */
  @media (max-width: 620px) {
    .content { padding: 0 20px; }
    .headline { font-size: clamp(1.7rem, 8.6vw, 3.4rem); letter-spacing: -.02em; }
    .headline-line { white-space: normal; }
    .background-logo { width: 145vw; opacity: .32; }
    .notify { width: min(350px, 100%); }
    .logo-item { padding: 0 clamp(12px, 4vw, 22px); height: 32px; }
    .logo-item img { max-width: clamp(46px, 13vw, 72px); }
    .logo-item--sas img { max-width: clamp(36.8px, 10.4vw, 57.6px); }
    .social-icons { bottom: calc(20px + 10px + 32px + 10px + 20px); }
  }

  @media (max-width: 350px) {
    .headline { font-size: clamp(1.5rem, 8.2vw, 2.4rem); letter-spacing: -.01em; }
  }

  @media (prefers-reduced-motion: reduce) {
    .noise, .marquee-track { animation: none; }
  }
</style>
</head>

          <span class="logo-item"><img src="https://res.cloudinary.com/x3vpljyu/image/upload/v1789313560/Formula_Masters_China_logo.webp" alt="Formula Masters China" loading="lazy"></span>
          <span class="logo-item"><img src="https://res.cloudinary.com/x3vpljyu/image/upload/v1789307227/new-Red-Bull-logo-white-png-vertical-large-size.webp" alt="Red Bull" loading="lazy"></span>
        </div>
      </div>
    </div>

    <nav class="social-icons" aria-label="Follow DIENASTIE">

  </main>

  <script>
    const form = document.getElementById('notifyForm');
    const status = document.getElementById('formStatus');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = form.querySelector('button');
      button.disabled = true;
      button.textContent = 'Sending';
      status.textContent = '';

      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { Accept: 'application/json' }
        });

        if (response.ok) {
          form.reset();
          status.textContent = 'You are in.';
          button.textContent = 'Sent';
        } else {
          throw new Error('Submission failed');
        }
      } catch (error) {
        status.textContent = 'Something went wrong. Try again.';
        button.disabled = false;
        button.textContent = 'Get in';
      }
    });
  </script>
